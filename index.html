
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Love Me?</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: white;
  font-family: monospace;
  min-height: 100vh;
  overflow: hidden;
}

/* HALAMAN AWAL */
.start {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.window {
  width: 90%;
  max-width: 420px;
  border: 3px solid white;
  box-shadow: 0 0 10px #fff;
  padding: 12px;
  text-align: center;
}

.top {
  border-bottom: 2px solid white;
  text-align: left;
  padding-bottom: 8px;
  font-size: 12px;
}

.content {
  padding: 55px 10px;
}

h2 {
  font-size: 22px;
  margin-bottom: 40px;
  text-shadow: 0 0 8px white;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 25px;
}

button {
  font-family: monospace;
  font-size: 17px;
  padding: 12px 28px;
  cursor: pointer;
  font-weight: bold;
}

#yes {
  color: white;
  background: black;
  border: 3px solid white;
}

#no {
  color: black;
  background: white;
  border: 3px solid white;
}

/* HALAMAN LOVE YOU */
.love-page {
  display: none;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  justify-content: center;
  align-items: center;
  background: #000;
}

.pattern {
  position: absolute;
  inset: -20px;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 8px;
  transform: rotate(-2deg);
  opacity: .65;
  pointer-events: none;
}

.pattern span {
  color: #ff168c;
  font-size: 13px;
  font-weight: bold;
  line-height: 20px;
  word-break: break-all;
  text-shadow: 0 0 5px #ff168c;
  animation: blink 1.5s infinite alternate;
}

@keyframes blink {
  from { opacity: .25; }
  to { opacity: .9; }
}

.center {
  z-index: 2;
  text-align: center;
  animation: appear 1.2s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(.3);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.love-text {
  font-size: clamp(30px, 8vw, 55px);
  font-weight: bold;
  color: white;
  text-shadow:
    0 0 5px #ff008c,
    0 0 15px #ff008c,
    0 0 30px #ff008c;
  animation: glow 1s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #ff008c; }
  to { text-shadow: 0 0 30px #ff008c, 0 0 60px #ff008c; }
}

.heart {
  font-size: 105px;
  color: white;
  margin-top: 12px;
  line-height: 1.3;
  filter: drop-shadow(0 0 10px #ff008c)
          drop-shadow(0 0 25px #ff008c);
  animation: heartbeat 1s infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}

.message {
  color: #ff8acb;
  font-size: 14px;
  margin-top: 15px;
  text-shadow: 0 0 8px #ff008c;
}

</style>
</head>

<body>

<!-- HALAMAN PERTANYAAN -->
<div class="start" id="start">
  <div class="window">
    <div class="top">● ● ●</div>

    <div class="content">
      <h2>Do you love me?</h2>

      <div class="buttons">
        <button id="yes" onclick="showLove()">
          Yes
        </button>

        <button id="no" onclick="showLove()">
          No
        </button>
      </div>
    </div>
  </div>
</div>

<!-- HALAMAN LOVE -->
<div class="love-page" id="lovePage">

  <div class="pattern" id="pattern"></div>

  <div class="center">
    <div class="love-text">LOVE YOU</div>

    <div class="heart">♥</div>

    <div class="message">
      YOU ARE MY FAVORITE PERSON ♡
    </div>
  </div>

</div>

<script>

// Membuat tulisan LOVE YOU berulang
const pattern = document.getElementById("pattern");

for (let i = 0; i < 350; i++) {
  const text = document.createElement("span");
  text.textContent = "I LOVE YOU";
  pattern.appendChild(text);
}

// Pindah halaman
function showLove() {
  document.getElementById("start").style.display = "none";

  const page = document.getElementById("lovePage");
  page.style.display = "flex";
}

</script>

</body>
</html>
